<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MHHS Timer - TV Style</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0a0f1e, #03060c);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, 'Inter', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
        }

        /* SPLASH SCREEN */
        .splash-screen {
            background: rgba(12, 20, 30, 0.85);
            backdrop-filter: blur(2px);
            border-radius: 64px;
            padding: 2rem 1.8rem 2.2rem;
            text-align: center;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(80, 180, 255, 0.3);
        }

        .splash-title {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFFFFF, #A0D0FF, #4CB8FF);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 1.5rem;
        }

        .splash-sub {
            font-size: 1.3rem;
            font-weight: 500;
            color: #c0e0ff;
            background: rgba(0, 0, 0, 0.4);
            display: inline-block;
            padding: 0.5rem 1.4rem;
            border-radius: 60px;
            margin-bottom: 2rem;
        }

        .footer-text {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #7e9dbb;
            border-top: 1px dashed rgba(76, 184, 255, 0.4);
            padding-top: 1.4rem;
        }

        /* START BUTTON (hover effect) */
        .start-trigger-btn {
            background: linear-gradient(105deg, #1f3b4c, #0f2c3a);
            border: none;
            padding: 14px 38px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #f0fcff;
            border-radius: 60px;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.25s ease;
            box-shadow: 0 5px 0 #0a1a22;
            border: 1px solid #3fa7e6;
        }

        .start-trigger-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(0, 160, 255, 0.3);
            background: linear-gradient(105deg, #2a4d62, #163b4a);
            border-color: #6bc8ff;
        }

        /* TV SCREEN */
        .tv-screen {
            background: #000000dd;
            background-image: radial-gradient(circle at 30% 20%, rgba(30, 40, 60, 0.4) 2%, transparent 2.5%);
            background-size: 28px 28px;
            border-radius: 32px;
            padding: 1.8rem 1.5rem 2rem;
            border: 3px solid #2c5e7e;
            box-shadow: 0 0 0 4px #0a1820, 0 20px 35px rgba(0,0,0,0.6), inset 0 0 20px rgba(0,255,255,0.1);
            position: relative;
            overflow: hidden;
        }

        .tv-screen::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(0deg, rgba(0,255,255,0.02) 0px, rgba(0,0,0,0.2) 2px, transparent 3px, transparent 6px);
            border-radius: 32px;
        }

        /* minimized state (restore down) */
        .tv-screen.minimized {
            transform: scale(0.88);
            margin-top: 10px;
            margin-bottom: 10px;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.6, 1);
        }

        .tv-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(100, 200, 255, 0.5);
            padding-bottom: 1rem;
        }

        .timer-display {
            font-family: 'Courier New', 'Fira Mono', monospace;
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 5px;
            background: linear-gradient(135deg, #e6f7ff, #9fd3ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            flex: 1;
            text-align: left;
        }

        .tv-content-area {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
            margin-top: 1rem;
        }

        .tv-message {
            font-size: 1.2rem;
            color: #bef0ff;
            background: rgba(0,0,0,0.5);
            padding: 0.8rem 1.5rem;
            border-radius: 100px;
            font-family: monospace;
        }

        .played-stats {
            font-size: 1rem;
            color: #ffd966;
            background: #1a2a33aa;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: bold;
        }

        /* buttons */
        .stop-btn, .reset-btn, .start-timer-btn {
            background: #301010e0;
            backdrop-filter: blur(8px);
            border: 1.5px solid #ff7b6e;
            padding: 8px 22px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 60px;
            color: #ffccc7;
            cursor: pointer;
            transition: 0.2s;
        }

        .stop-btn:hover, .reset-btn:hover, .start-timer-btn:hover {
            background: #a02f2fdd;
            color: white;
            transform: scale(0.97);
        }

        .start-timer-btn {
            background: #1f4d3ce0;
            border-color: #6effb0;
            color: #c8ffdb;
        }

        .start-timer-btn:hover {
            background: #2e6b53dd;
        }

        .reset-btn {
            background: #2a2f3ce0;
            border-color: #ffbc6e;
            color: #ffe3b3;
        }

        .button-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 8px;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 550px) {
            .timer-display { font-size: 2.2rem; letter-spacing: 2px; }
            .splash-title { font-size: 2rem; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- SPLASH SCREEN -->
    <div id="splashPanel" class="splash-screen">
        <div class="splash-title">Welcome to MHHS Timer</div>
        <div class="splash-sub">⏱️ MHHS Timer starting</div>
        <div id="dynamicButtonContainer" style="min-height: 80px;"></div>
        <div class="footer-text">⚡ powered by mhhs game ⚡</div>
    </div>

    <!-- TV SCREEN -->
    <div id="tvPanel" class="tv-screen hidden">
        <div class="tv-header">
            <div class="timer-display" id="timerValue">00:00:00</div>
            <button id="stopRestoreBtn" class="stop-btn">⏹️ STOP</button>
        </div>
        <div class="tv-content-area">
            <div class="tv-message">📺 LIVE TIMER · RETRO MODE</div>
            <div id="playedStats" class="played-stats">⏱️ 00:00 la ciyaaray</div>
            <div class="button-group">
                <button id="resetTimerBtn" class="reset-btn">🔄 Reset</button>
                <button id="startTimerBtn" class="start-timer-btn">▶️ Start / Resume</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ========== DOM Elements ==========
    const splashDiv = document.getElementById('splashPanel');
    const tvDiv = document.getElementById('tvPanel');
    const dynamicBtnContainer = document.getElementById('dynamicButtonContainer');
    const timerElement = document.getElementById('timerValue');
    const stopRestoreBtn = document.getElementById('stopRestoreBtn');
    const resetBtn = document.getElementById('resetTimerBtn');
    const startTimerBtn = document.getElementById('startTimerBtn');
    const playedStatsSpan = document.getElementById('playedStats');

    // ========== Timer State Variables ==========
    let startTimeReference = null;      // timestamp when timer started/resumed (ms)
    let accumulatedTime = 0;            // milliseconds accumulated while timer was running (paused time)
    let isTimerActive = false;           // whether timer is currently counting
    let timerIntervalId = null;
    
    let isMinimized = false;             // TV minimized state

    // ========== Helper: format mm:ss or HH:MM:SS (but we show mm:ss for under 1hr + readable) ==========
    function formatTime(ms) {
        if (ms < 0) ms = 0;
        const totalSeconds = Math.floor(ms / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }
    
    // full display with hours if needed > 59 min
    function formatDisplay(ms) {
        if (ms < 0) ms = 0;
        const totalSeconds = Math.floor(ms / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        if (hours > 0) {
            return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
        return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }
    
    // update timer display based on current accumulated + elapsed since start if active
    function getCurrentElapsed() {
        if (!isTimerActive || startTimeReference === null) {
            return accumulatedTime;
        }
        const now = Date.now();
        return accumulatedTime + (now - startTimeReference);
    }
    
    function refreshDisplay() {
        const currentMs = getCurrentElapsed();
        timerElement.innerText = formatDisplay(currentMs);
        // update "inta minute / saacad la ciyaaray"
        const totalSeconds = Math.floor(currentMs / 1000);
        const minutesPlayed = Math.floor(totalSeconds / 60);
        const secondsRem = totalSeconds % 60;
        if (minutesPlayed > 0) {
            playedStatsSpan.innerText = `⏱️ ${minutesPlayed} min ${secondsRem} sec la ciyaaray`;
        } else {
            playedStatsSpan.innerText = `⏱️ ${totalSeconds} sec la ciyaaray`;
        }
        // optional extra: if over 1 hour
        if (currentMs >= 3600000) {
            const hrs = Math.floor(currentMs / 3600000);
            const mins = Math.floor((currentMs % 3600000) / 60000);
            playedStatsSpan.innerText = `⏱️ ${hrs} saac ${mins} min la ciyaaray`;
        }
    }
    
    function startTimerInternal() {
        if (isTimerActive) return;
        // start from current accumulated time
        startTimeReference = Date.now();
        isTimerActive = true;
        if (timerIntervalId) clearInterval(timerIntervalId);
        timerIntervalId = setInterval(() => {
            refreshDisplay();
        }, 180);
        refreshDisplay();
    }
    
    function pauseTimerInternal() {
        if (!isTimerActive) return;
        // freeze current elapsed into accumulatedTime
        const now = Date.now();
        if (startTimeReference !== null) {
            accumulatedTime += (now - startTimeReference);
        }
        isTimerActive = false;
        startTimeReference = null;
        if (timerIntervalId) {
            clearInterval(timerIntervalId);
            timerIntervalId = null;
        }
        refreshDisplay(); // show paused value
    }
    
    function resetTimer() {
        // completely reset timer to zero, stop counting
        const wasActive = isTimerActive;
        if (timerIntervalId) {
            clearInterval(timerIntervalId);
            timerIntervalId = null;
        }
        accumulatedTime = 0;
        isTimerActive = false;
        startTimeReference = null;
        refreshDisplay();
        // if reset while it was active, we don't auto-start
        // if user wants start, they press start button
        // also show message that timer reset
        playedStatsSpan.innerText = `⏱️ 00:00 la ciyaaray (reset)`;
    }
    
    // resume / start from current accumulated time
    function resumeTimer() {
        if (isTimerActive) return;
        startTimerInternal();
    }
    
    // stop button action: minimize/restore TV, AND pause/stop the timer (as per your new request: marka stop la dhaho waa inuu istago wakhtiga)
    // You said: "marka STOP la dhaho wa inuu dhexda so istaga" => when STOP is pressed, timer should pause/stop.
    // And also minimize/restore TV screen.
    function handleStopAction() {
        // 1. Pause the timer (stop counting)
        pauseTimerInternal();
        
        // 2. Minimize or restore TV screen (toggle)
        if (tvDiv) {
            if (isMinimized) {
                tvDiv.classList.remove('minimized');
                isMinimized = false;
            } else {
                tvDiv.classList.add('minimized');
                isMinimized = true;
            }
        }
    }
    
    // ========== Switch from Splash to TV (Start Time button clicked) ==========
    function switchToTVScreen() {
        // Reset all timer state clean before showing TV? But user expects fresh start.
        // When "Start Time" clicked, make timer fresh from ZERO and NOT running until they press "Start/Resume"? Actually spec: when Start Time clicked, button disappears and TV appears.
        // Better: timer shows 00:00, and it's waiting for user to press "Start / Resume" inside TV.
        // However also intuitive: we can set accumulatedTime=0, paused state.
        resetTimer();          // ensures 00:00, not counting
        pauseTimerInternal();  // make sure it's stopped
        
        // Hide splash, show TV
        splashDiv.classList.add('hidden');
        tvDiv.classList.remove('hidden');
        tvDiv.classList.remove('minimized');
        isMinimized = false;
        
        // Update stats message cleanly
        playedStatsSpan.innerText = `⏱️ 00:00 la ciyaaray`;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    
    // ========== Splash button creation after 5 seconds ==========
    let startButtonCreated = false;
    let splashTimeout = null;
    
    function createStartButton() {
        if (startButtonCreated) return;
        const startBtn = document.createElement('button');
        startBtn.innerText = '🚀 Start Time';
        startBtn.className = 'start-trigger-btn';
        startBtn.addEventListener('click', (e) => {
            e.preventDefault();
            // Remove button (disappear) and switch to TV mode
            if (startBtn && startBtn.parentNode) startBtn.remove();
            startButtonCreated = false;
            if (splashTimeout) clearTimeout(splashTimeout);
            switchToTVScreen();
        });
        dynamicBtnContainer.appendChild(startBtn);
        startButtonCreated = true;
    }
    
    window.addEventListener('DOMContentLoaded', () => {
        if (splashTimeout) clearTimeout(splashTimeout);
        splashTimeout = setTimeout(() => {
            if (splashDiv && !splashDiv.classList.contains('hidden')) {
                createStartButton();
            }
        }, 5000);
    });
    
    // ========== Attach TV control events ==========
    if (stopRestoreBtn) {
        stopRestoreBtn.addEventListener('click', () => {
            // Only if TV is visible
            if (tvDiv && !tvDiv.classList.contains('hidden')) {
                handleStopAction();  // pauses timer + minimize/restore screen
            }
        });
    }
    
    if (resetBtn) {
        resetBtn.addEventListener('click', () => {
            if (tvDiv && !tvDiv.classList.contains('hidden')) {
                resetTimer();
                // If timer was active, reset also stops it (clean)
                // Additionally if user wants fresh counter
                playedStatsSpan.innerText = `⏱️ 00:00 la ciyaaray (reset)`;
            }
        });
    }
    
    if (startTimerBtn) {
        startTimerBtn.addEventListener('click', () => {
            if (tvDiv && !tvDiv.classList.contains('hidden')) {
                // Resume or start timer from current accumulated value
                resumeTimer();
            }
        });
    }
    
    // Additional cleanup: prevent memory leaks
    window.addEventListener('beforeunload', () => {
        if (timerIntervalId) clearInterval(timerIntervalId);
    });
    
    // Optional: ensure that when TV is minimized/restored, timer works perfectly (it does)
    // We also satisfy all points:
    // - splash screen: welcome text + "MHHS Timer starting" + footer "powered by mhhs game"
    // - after 5 seconds button appears with hover
    // - click Start Time: button disappears, TV screen appears, timer/content moves to top.
    // - Stop button (on TV) makes timer STOP counting (pause) + minimize/restore down TV screen (size toggle).
    // - Reset / Start buttons provide clean control and display minutes played.
    // - The timer shows how many minutes have been played (intii la ciyaaray)
    console.log("MHHS Timer Ready - Stop button now stops timer and toggles size");
</script>
</body>
</html>
